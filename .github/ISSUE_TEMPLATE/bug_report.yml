name: Bug Report
description: Report a defect in the CLI, hooks, adapters, or generated artifacts.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in as much as you can — a report we can't
        reproduce is a report we can't fix. Security vulnerabilities should **not** be filed
        here; see [SECURITY.md](../../SECURITY.md) instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short, clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps that reliably reproduce the issue, starting from a clean checkout if possible.
      placeholder: |
        1. Run `minervit-methodology ...`
        2. ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Windows (native)
        - Other
    validations:
      required: true

  - type: dropdown
    id: agent-runtime
    attributes:
      label: Agent Runtime
      description: Which agent runtime were you using, if any?
      options:
        - Claude Code
        - Codex
        - Neither / CLI only
        - Other
    validations:
      required: true

  - type: input
    id: agent-runtime-version
    attributes:
      label: Agent Runtime Version
      description: Output of the runtime's own `--version` (leave blank if you selected "Neither / CLI only").
    validations:
      required: false

  - type: input
    id: framework-version
    attributes:
      label: Framework Version
      description: Contents of the repo's `VERSION` file, or `minervit-methodology version`.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: >
        Paste relevant logs or the output of `scripts/test.sh`. This will be rendered as a
        shell code block automatically.
      render: shell
    validations:
      required: false
