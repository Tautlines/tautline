name: validate

on:
  pull_request:
  push:
    branches:
      - main

# See the rationale in ci-python.yml: cancel superseded PR runs, never cancel a push run whose
# output a gate consumes.
# github.run_id for non-PR events gives each push run its own group; see the fuller note in
# ci-python.yml on why cancel-in-progress alone does not protect a PENDING push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # Local hardware when CI_RUNNER_LABEL is set, ubuntu-latest otherwise so forks of the public
    # mirror keep working -- see the fuller note in ci-python.yml and .github/runner/README.md.
    #
    # The fallback is no longer silent, and the two cases now differ: a FORK still falls back to
    # hosted quietly, which is correct for it, but on THIS repo an unset CI_RUNNER_LABEL fails the
    # run unless CI_ALLOW_HOSTED_FALLBACK=1 says the billed run was deliberate. See the
    # assert-runner-identity step below.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/assert-runner-identity
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}
          allow-hosted-fallback: ${{ vars.CI_ALLOW_HOSTED_FALLBACK }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # No dev toolchain install: this job no longer runs pytest, and every gate below is either
      # stdlib python3 or git. Installing ruff/mypy/pytest to not use them was ~1-2 minutes of
      # every push.

      # scripts/validate.sh is a frozen 5-line alias of scripts/test.sh, so running it here ran
      # the WHOLE suite a second time on every push, in parallel with ci-python running the same
      # suite against the same tree. Same tests, same tree, same verdict -- ~18 minutes of it.
      #
      # The validate-freeze whole-suite guarantee is NOT weakened: validate.sh still invokes the
      # entire suite (never a narrowed selection), tests/test_validate_freeze.py still enforces
      # that contract and still runs inside every ci-python suite run, and the alias itself is
      # still exercised end-to-end by ci-python-full on every merge into the integration branch.
      # What changed is only how often the duplicate execution happens.
      #
      # The gates BELOW are this job's real contribution: they are not in the pytest suite, they
      # cost seconds, and they stay on every push.
      # The step id stays `methodology-suite` on purpose: it is a published CommandCenter evidence
      # key (`validate.methodology-suite`), and renaming it would break every consumer reading the
      # historical series. What the gate CHECKS changed; what it is called must not.
      - name: Check the frozen alias still delegates to the real gate
        id: methodology-suite
        run: |
          set -euo pipefail
          # Fail closed if the alias ever stops delegating to the real gate: the freeze budget
          # keeps validate.sh small, and this keeps it POINTED AT the suite. Cheap enough to run
          # on every push; the execution itself belongs to ci-python and ci-python-full.
          grep -q 'scripts/test.sh' scripts/validate.sh \
            || { echo "scripts/validate.sh no longer delegates to scripts/test.sh" >&2; exit 1; }
          echo "validate.sh delegates to the real gate OK"

      - name: Compile CLI
        id: compile-cli
        if: always()
        run: python3 -m py_compile bin/tautline

      # arch-validate-tests-1/2: validate.sh is retired to a thin wrapper so it
      # cannot grow back into grep pins. The
      # authoritative check lives in tests/test_validate_freeze.py (run in full by
      # ci-python via scripts/test.sh). This step gives the same fast signal here.
      - name: Freeze-check validate.sh line budget
        id: validate-sh-freeze
        if: always()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          test_src = Path("tests/test_validate_freeze.py").read_text()
          budget = int(re.search(r"^BUDGET_LINES = (\d+)", test_src, re.M).group(1))
          actual = Path("scripts/validate.sh").read_bytes().count(b"\n")
          if actual > budget:
              raise SystemExit(
                  f"scripts/validate.sh grew to {actual} lines (budget {budget}); "
                  "it is frozen -- put the new validation behavior in a pytest, not a grep pin."
              )
          print(f"validate.sh frozen OK: {actual} <= {budget} lines")
          PY

      - name: Check whitespace in changed files
        id: whitespace
        if: always()
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "${base_ref}"
          base="$(git merge-base "origin/${base_ref}" HEAD)"
          git diff --check "${base}..HEAD"

      # Single field, single condition, no network: refuses a PR whose title/body carry no
      # `Backlog: <id>` (or provider-native) reference when THIS repo's `.tautline.json` names a
      # `backlog` provider -- and is a silent no-op (exit 0) on every repo state where it does
      # not. `GITHUB_EVENT_NAME`/`GITHUB_EVENT_PATH` are GitHub's own default env vars, already
      # present in every step; the script reads the PR title/body from the event JSON rather than
      # from a `${{ github.event.pull_request.* }}` expression so untrusted PR text is never
      # interpolated into a shell command. See scripts/check_pr_backlog_ref.py and
      # docs/reference/backlog.md ("PR reference stamp") for the grammar and the why.
      - name: Check the PR names its backlog item
        id: pr-backlog-ref
        if: always()
        run: python3 scripts/check_pr_backlog_ref.py

      # CommandCenter evidence: one `eval` suite whose results are the gates this job owns.
      # Each gate step has `if: always()` so a later gate still reports after an earlier failure
      # (the job still fails -- blocking behavior is unchanged); the composer maps each outcome.
      - name: Compose evidence document
        if: always()
        run: |
          python3 .github/scripts/emit_evidence.py \
            --out evidence/evidence.json \
            --suite validate:eval \
            --result validate.methodology-suite=${{ steps.methodology-suite.outcome }} \
            --result validate.compile-cli=${{ steps.compile-cli.outcome }} \
            --result validate.validate-sh-freeze=${{ steps.validate-sh-freeze.outcome }} \
            --result validate.whitespace=${{ steps.whitespace.outcome }} \
            --result validate.pr-backlog-ref=${{ steps.pr-backlog-ref.outcome }}

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence
          path: evidence/
