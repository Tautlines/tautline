name: renderer-ci

# Build/test gate for the iteration-review renderer-kit (sec-supplychain-1). Runs only when
# the renderer-kit path changes so unrelated PRs stay fast. Installs with `npm ci` for a
# reproducible, lockfile-exact tree (never `npm install`), then typechecks and tests.
on:
  # Path-filtered triggers mean this workflow may never have run on the default branch, which
  # leaves the README badge with no status to render. workflow_dispatch allows a manual run to
  # populate it.
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/tautline-ops/skills/iteration-review/renderer-kit/**"
      - ".github/workflows/renderer-ci.yml"
  push:
    branches: [main]
    paths:
      - "plugins/tautline-ops/skills/iteration-review/renderer-kit/**"
      - ".github/workflows/renderer-ci.yml"

permissions:
  contents: read

jobs:
  renderer:
    # Local hardware, on operator instruction 2026-08-02 ("no more billed hosted runs"), superseding
    # the earlier call to leave it hosted because there was no bill worth saving.
    #
    # An unset CI_RUNNER_LABEL on THIS repo now FAILS the run: there it means the local runner was
    # lost and the job silently moved onto billed compute while still reporting green. Set
    # CI_ALLOW_HOSTED_FALLBACK=1 to accept billed runs deliberately (passes with a warning).
    #
    # A FORK running its OWN CI has no repo variables, resolves to ubuntu-latest, and the assertion
    # short-circuits -- correct. That is NOT fork-PR safety: a pull_request from a fork against this
    # repo resolves `github.repository` and repo variables from the BASE repo and routes HERE.
    # Containment is that this repository is PRIVATE. See the action header.
    #
    # Same trade as npm-audit: `npm ci` runs dependency lifecycle scripts from PR-controlled
    # manifests. The container protects the host; jobs are not isolated from each other, and the
    # machine is on the operator's LAN. See .github/runner/README.md.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: plugins/tautline-ops/skills/iteration-review/renderer-kit
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/assert-runner-identity
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}
          allow-hosted-fallback: ${{ vars.CI_ALLOW_HOSTED_FALLBACK }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      # Reproducible install: `npm ci` aborts on a package.json/package-lock.json mismatch,
      # so it doubles as the renderer-kit lockfile-sync check.
      - name: npm ci
        run: npm ci

      # Typecheck if the package declares a `typecheck` script (tsc --noEmit). Guarded so the
      # job stays correct if the script is ever renamed/removed rather than failing opaquely.
      - name: Typecheck (tsc --noEmit)
        run: |
          if npm run | grep -qE '^  typecheck'; then
            npm run typecheck
          else
            echo "no typecheck script — skipping"
          fi

      # Test if the package declares a `test` script (vitest run). The junit reporter writes the
      # CommandCenter evidence artifact; `--reporter=default` keeps the human-readable log.
      - name: Test
        run: |
          if npm run | grep -qE '^  test'; then
            npm test -- --reporter=default --reporter=junit --outputFile.junit=evidence/renderer.junit.xml
          else
            echo "no test script — skipping"
          fi

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence
          path: plugins/tautline-ops/skills/iteration-review/renderer-kit/evidence/
