name: ci-python

on:
  pull_request:
  push:
    branches:
      - main

# Supersede-and-cancel. A second push to the same PR makes the first run's verdict irrelevant the
# instant it lands, but GitHub bills the superseded run all the way to completion anyway -- at an
# ~18-minute suite and a push-amend development cadence, that duplicate spend was the single
# largest line in this repo's Actions bill.
#
# `cancel-in-progress` is deliberately scoped to pull_request and NOT to push. A push to a
# protected branch composes the `evidence` artifact that downstream gates consume, so cancelling
# one would destroy a verdict rather than a redundant copy of a verdict; PR runs have no such
# consumer and are pure duplicate signal.
# The group KEY, not just cancel-in-progress, is what protects push runs. `cancel-in-progress: false`
# spares a RUNNING run but not a PENDING one: a third run entering a group still cancels the queued
# second, so two quick pushes to a protected branch would silently drop the middle run's `evidence`
# artifact that downstream gates consume. Mixing github.run_id into the key for non-PR events gives
# every push run a group of its own, where there is nothing to supersede it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ONE Python leg per PR. The declared floor is NOT abandoned -- it moves to the daily
  # `ci-python-full` schedule, which runs the whole supported matrix (see that workflow, and
  # tests/test_evidence_artifacts.py, which fails closed if the daily job stops covering every
  # version this job dropped). Per-PR CI exists to tell you fast whether your change is broken;
  # a second interpreter re-running the identical suite answers that question twice.
  #
  # The job id and its matrix leg name together form the check name a base branch would bind as a
  # required status check (`python (3.12)`), so renaming either silently unbinds that gate wherever
  # one is configured.
  python:
    # Local hardware when this repo provides it, billed GitHub-hosted otherwise. GitHub does not
    # meter Actions minutes for runners it does not own, and this workflow was 73% of this repo's
    # Actions bill; it is also ~11x faster locally (101s vs 18m45s, the hosted runner being 2 cores).
    #
    # Selected through a repo VARIABLE rather than a hardcoded label, because this file ships in the
    # public release export. A hardcoded `self-hosted` would leave every fork of the public mirror
    # queueing forever against a runner it does not have, with no signal that anything is wrong.
    # Unset -> ubuntu-latest, so outside forks keep working untouched; set to a runner label (this
    # repo uses `tautline`) -> the local runner. See .github/runner/README.md, which also covers
    # what happens when the local runner is offline (jobs queue; nothing merges, because a job that
    # never ran cannot report green).
    #
    # ci-python-full reads the same variable as of the 3.12 floor raise -- dropping the 3.10 leg
    # removed the second-interpreter problem that kept it hosted. Deliberately NOT applied to the
    # publish workflows: a release must not depend on a local machine being awake.
    #
    # THE FALLBACK IS NO LONGER SILENT, and the two cases it serves now diverge. A FORK still falls
    # back to ubuntu-latest quietly -- correct, since hosted is the only thing a fork has. On THIS
    # repo an unset CI_RUNNER_LABEL now FAILS the run, because there it means the local runner was
    # lost and every gate quietly moved onto billed compute while still reporting green. To take
    # billed runs deliberately (the machine is away), set CI_ALLOW_HOSTED_FALLBACK=1 as well; that
    # passes with a warning. See the assert-runner-identity step below and .github/runner/README.md.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # A single modern version. Kept as a matrix, not flattened to a bare job, so the check name
        # and the per-leg evidence artifact keep their existing shape and the daily workflow can
        # stay a superset rather than a fork.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/assert-runner-identity
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}
          allow-hosted-fallback: ${{ vars.CI_ALLOW_HOSTED_FALLBACK }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev toolchain
        run: pip install -r requirements-dev.txt

      # ONE full-suite pass, and no coverage instrumentation. Coverage is a RATCHET, not a
      # per-change signal: it answers "has whole-repo coverage regressed", a question whose answer
      # cannot meaningfully change between two pushes an hour apart, and measuring it costs ~40%
      # more wall clock on every one of them. The blocking ratchet moved to the daily
      # `ci-python-full` matrix, where it still fails the run below the .coveragerc floor.
      # Per-change exercise of NEW lines is a different gate entirely (the diff-coverage check),
      # and that one is unaffected. Guard against re-defanging: tests/test_coverage_gate_enforced.py.
      - name: Run python checks
        run: scripts/test.sh

      # scripts/test.sh appends its own --junitxml LAST and pytest takes the last value, so the
      # suite's report only ever lands at .ai-runs/test-runs/latest-junit.xml. Copy it rather than
      # trying to redirect it: that stable path is what `tautline test-run` hashes. `if: always()`
      # because a RED run's report is the one that matters, and `|| true` for a run that died
      # before pytest (a ruff or mypy failure), where no report exists and the leg's verdict is
      # carried by leg-status.txt.
      - name: Publish the suite's JUnit report as evidence
        if: always()
        run: |
          mkdir -p evidence
          cp .ai-runs/test-runs/latest-junit.xml evidence/pytest.junit.xml || true

      # This leg's own verdict, recorded even when it died before pytest (a ruff or mypy
      # failure). `job.status` is success | failure | cancelled -- exactly the vocabulary the
      # composer maps. Writing it unconditionally is what guarantees the aggregation job's
      # downloads can never miss.
      - name: Record this leg's outcome
        if: always()
        run: |
          mkdir -p evidence
          printf '%s' '${{ job.status }}' > evidence/leg-status.txt

      - name: Upload this leg's evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-py-${{ matrix.python-version }}
          path: evidence/

  # CommandCenter evidence aggregation: compose the run's single `evidence` artifact from every
  # ci-python job. `needs` spans all reporting jobs so a red job can never publish green evidence.
  #
  # Only the 3.12 leg is composed here because only the 3.12 leg runs per PR, and there is no
  # fresh-install result because that gate runs daily now. Neither verdict is silently dropped --
  # both moved to `ci-python-full`, which composes its own evidence for the whole matrix plus the
  # packaging gate. Pins shape: tests/test_evidence_artifacts.py.
  evidence:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    needs: [python]
    # Runs on success AND failure (the whole point), but not on a cancelled run, where the
    # legs may never have uploaded and the downloads below would have nothing to fetch.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/assert-runner-identity
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}
          allow-hosted-fallback: ${{ vars.CI_ALLOW_HOSTED_FALLBACK }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: evidence-py-3.12
          path: legs/py-3.12

      - name: Compose the run's evidence
        run: |
          mkdir -p evidence
          if [ -f legs/py-3.12/pytest.junit.xml ]; then
            cp legs/py-3.12/pytest.junit.xml evidence/pytest.junit.xml
          fi
          python3 .github/scripts/emit_evidence.py \
            --out evidence/evidence.json \
            --suite ci-python:probe \
            --result "ci-python.py-3.12=$(cat legs/py-3.12/leg-status.txt)"

      - name: Upload evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence
          path: evidence/
