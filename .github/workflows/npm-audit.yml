name: npm-audit

on:
  pull_request:
    paths:
      - "plugins/tautline-ops/skills/iteration-review/renderer-kit/package*.json"
      - ".github/workflows/npm-audit.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly Monday 06:00 UTC — catch newly-disclosed advisories

permissions:
  contents: read

jobs:
  audit:
    # Local hardware, on operator instruction 2026-08-02 ("no more billed hosted runs"). This
    # supersedes the earlier call to leave it hosted on the grounds that it was cheap enough not to
    # bother -- the instruction is categorical, not a cost threshold.
    #
    # An unset CI_RUNNER_LABEL on THIS repo now FAILS the run: there it means the local runner was
    # lost and the job quietly moved onto billed compute while still reporting green. To take billed
    # runs deliberately, set CI_ALLOW_HOSTED_FALLBACK=1 as well; that passes with a warning.
    #
    # A FORK that runs its OWN CI has no repo variables, so it resolves to ubuntu-latest and the
    # assertion short-circuits -- correct, since hosted is the only compute it has. Do NOT read that
    # as fork-PR safety: a pull_request opened FROM a fork AGAINST this repo resolves
    # `github.repository` and the repo variables from the BASE repo, so it routes HERE, to the
    # self-hosted runner, and runs `npm ci` from a PR-controlled manifest. What contains that is
    # this repository being PRIVATE, not anything in the routing. See the action header.
    #
    # The trade this accepts: `npm ci` below executes dependency lifecycle scripts, and the
    # dependabot PRs that trigger this workflow are exactly the ones introducing newly published
    # versions. The container protects the HOST, but jobs are not isolated from each other and the
    # machine sits on the operator's LAN. Recorded as a decision, not an oversight.
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: plugins/tautline-ops/skills/iteration-review/renderer-kit
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/assert-runner-identity
        with:
          runner-label: ${{ vars.CI_RUNNER_LABEL }}
          allow-hosted-fallback: ${{ vars.CI_ALLOW_HOSTED_FALLBACK }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      # Lockfile-sync gate (sec-supplychain-7): `npm ci` aborts when package.json and
      # package-lock.json disagree, so a drifted/hand-edited lock fails the build instead
      # of silently installing a different tree than the manifest declares. This also gives
      # the audit step a reproducible, lock-exact install rather than `npm install` resolution.
      - name: npm ci (lockfile-sync + reproducible install)
        run: npm ci

      # Gate: fail ONLY on critical (green today, full tree incl. dev deps). Audits the
      # committed lockfile; needs network for the advisory DB. Never use --offline (false
      # clean) and don't --omit=dev (a critical dev advisory must block).
      - name: npm audit (blocking — critical)
        id: audit-critical
        run: npm audit --audit-level=critical

      # Visibility: report high/moderate without failing the build.
      - name: npm audit (informational — high+)
        id: audit-high
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high

      # CommandCenter evidence: a `probe` suite reporting both audit levels. `outcome` (not
      # `conclusion`) is what continue-on-error preserves, so a failing high+ audit stays honest
      # (a `fail` result) even though the job itself is green -- the existing (deliberate) policy
      # expressed as evidence. The job's defaults.run.working-directory is the renderer-kit, so
      # the composer step overrides it back to the repo root where the script lives.
      - name: Compose evidence document
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/emit_evidence.py \
            --out evidence/evidence.json \
            --suite npm-audit:probe \
            --result npm-audit.critical=${{ steps.audit-critical.outcome }} \
            --result npm-audit.high=${{ steps.audit-high.outcome }}

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence
          path: evidence/
