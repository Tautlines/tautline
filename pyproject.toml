# Tool configuration for the Minervit methodology repo.
# The checkout still runs through the extension-less executable
# (bin/tautline), with implementation gradually moving into the
# repo-local src/minervit_methodology package. It is not an installable package
# yet, so there is intentionally no [project]/[build-system] table.
# Dev dependencies live in requirements-dev.txt; this file is the single source of
# lint/type/test configuration.

[tool.ruff]
# The floor rationale below is verified and shared verbatim with CONTRIBUTING.md
# (tests/test_front_door_docs.py pins both).
#
# Raised 3.10 -> 3.12 on 2026-07-31 by operator decision. Nothing in the tree ever REQUIRED 3.10:
# it parses clean under the 3.9 grammar, and the floor rested entirely on zip(strict=) (PEP 618),
# which exists in every version from 3.10 up. So the old floor was a support PROMISE, not a
# dependency -- and keeping it cost a second CI interpreter leg that had to be hand-built into the
# self-hosted runner image, because Ubuntu 24.04 ships only 3.12. The operator's call: adopters
# still on 3.10/3.11 upgrade. 3.12 is what the runner ships and what every gate now proves.
target-version = "py312"   # 3.12 is the declared floor, and CI proves it on every merge
line-length = 100

[tool.ruff.lint]
# High-signal essentials only. F = real pyflakes bugs, E/W = pycodestyle, B = bugbear.
# Opinionated families (TRY/EM/PLR/UP/SIM) are deliberately OUT for now (3,000+ legacy hits).
select = ["E", "F", "W", "B"]
ignore = ["E501"]          # frozen legacy baseline, pinned by tests/test_lint_ratchet.py

[tool.ruff.lint.per-file-ignores]
# Day-one baseline for the legacy CLI: suppress ONLY the rules it currently violates so
# CI is green with zero code changes. Delete codes here as they are fixed — that is the
# ratchet. NEW violations of any OTHER rule, and these rules in any OTHER file, still fail.
# The package-split flip (roadmap #11) moved the entire CLI engine body out of bin/tautline
# (now a thin shim, which violates none of these) into the package's cli.py, so the legacy
# suppressions move verbatim with the code.
# F541 was FIXED and deleted (carve item: a suppressed violation inside a carved span
# resurfaces in the destination file, where no suppression covers it -- the first W1
# carve failed the gate exactly that way). The remaining two are behaviour-adjacent
# (side-effect assignments, exception chaining); each carve lane clears its own region
# in a reviewed pre-carve hygiene commit before relocating it.
"src/tautline_methodology/cli.py" = [
    "F841",  # unused-variable
    "B904",  # raise-without-from-inside-except
]

[tool.mypy]
python_version = "3.12"          # match the declared 3.12 floor (mypy verified green at 3.12)
check_untyped_defs = false
warn_unused_ignores = false      # 6 existing `# type: ignore` stay; flip true in ratchet step 5
warn_return_any = false
warn_unused_configs = true
# Lenient baseline. The duplicate-def ROOT cause is now FIXED (arch-cli-6): the shadowed
# slugify/path_is_under defs were deleted, so no-redef and its cascading call-arg errors are gone
# and those codes are removed from this list. Remaining disabled codes trace to untyped
# json.load/subprocess output -> Any|None narrowing (union-attr / index / arg-type / dict-item /
# assignment). Remove codes as the underlying issues are fixed (see spec §9 ratchet).
disable_error_code = [
    "union-attr",
    "index", "arg-type", "dict-item", "assignment",
    "var-annotated", "operator", "attr-defined",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
